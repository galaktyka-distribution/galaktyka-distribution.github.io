const ME={uid:null,login:null,name:null,role:null};
const PEER=Math.random().toString(36).slice(2,10);
const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
const mailOf=login=>{const k=String(login||'').trim().toLowerCase();const u=LOGIN_MAIL[k]||k.replace(/[^a-z0-9._-]/g,'');return u.includes('@')?u:u+'@'+MAIL_DOMAIN};
async function claim(){const {data,error}=await sb.rpc('claim_member');if(error)throw error;const r=Array.isArray(data)?data[0]:data;if(!r)throw {code:'not_member',message:'Цього користувача немає в списку доступу'};
  const {data:u}=await sb.auth.getUser();ME.uid=u&&u.user?u.user.id:null;ME.login=r.login;ME.name=r.name;ME.role=r.role;return r}
const SBX=window.SBX={client:sb,me:ME,mailOf,
  async restore(){try{const {data}=await sb.auth.getSession();if(!data||!data.session)return null;const r=await claim();return r.login}catch(e){console.warn(e);return null}},
  async signIn(login,password){const {error}=await sb.auth.signInWithPassword({email:mailOf(login),password});if(error)return {ok:false,err:error};try{const r=await claim();return {ok:true,login:r.login,name:r.name,role:r.role}}catch(e){await sb.auth.signOut();return {ok:false,err:e}}},
  async signOut(){try{await sb.auth.signOut()}catch(e){}}};

// ---- база: колекції/документи у таблиці docs(coll,id,data) ----
const snapDoc=(id,row)=>({id,exists:!!row,data:()=>row?clone(row.data):undefined});
const snapQ=rows=>({docs:rows.map(r=>snapDoc(r.id,r)),size:rows.length,empty:!rows.length});
const err=e=>{const x=new Error(e&&e.message||'Помилка бази');x.code=e&&e.code;return x};
async function fetchRows(coll,filters){const out=[];for(let from=0;;from+=1000){let q=sb.from('docs').select('id,data').eq('coll',coll).order('id').range(from,from+999);
    (filters||[]).forEach(([f,op,v])=>{const col='data->>'+f;if(op==='=='||op==='eq')q=q.eq(col,String(v));else if(op==='in')q=q.in(col,(v||[]).map(String));else if(op==='!=')q=q.neq(col,String(v));else throw err({message:'Непідтримуваний фільтр '+op})});
    const {data,error}=await q;if(error)throw err(error);out.push(...data);if(data.length<1000)break}return out}
// живе оновлення: один канал на колекцію, слухачі перечитують свої дані
const LS={};let chanSeq=0;
function listen(coll,fn){let L=LS[coll];if(!L){L=LS[coll]={fns:new Set(),t:null,ids:new Set(),ch:null};
    L.ch=sb.channel('docs-'+coll+'-'+(++chanSeq)).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coll=eq.'+coll},p=>{const id=(p.new&&p.new.id)||(p.old&&p.old.id)||null;L.ids.add(id);clearTimeout(L.t);L.t=setTimeout(()=>{const ids=new Set(L.ids);L.ids.clear();L.fns.forEach(f=>{try{f(ids)}catch(e){console.error(e)}})},250)}).subscribe()}
  L.fns.add(fn);return ()=>{L.fns.delete(fn);if(!L.fns.size){try{sb.removeChannel(L.ch)}catch(e){}delete LS[coll]}}}
function docRef(coll,id){return {id,
  async get(){const {data,error}=await sb.from('docs').select('id,data').eq('coll',coll).eq('id',id).maybeSingle();if(error)throw err(error);return snapDoc(id,data)},
  async set(x){const {error}=await sb.from('docs').upsert({coll,id,data:clone(x)||{},updated_at:new Date().toISOString()},{onConflict:'coll,id'});if(error)throw err(error)},
  async update(x){const {error}=await sb.rpc('doc_merge',{p_coll:coll,p_id:id,p_patch:clone(x)||{}});if(error)throw err(error)},
  async delete(){const {error}=await sb.from('docs').delete().eq('coll',coll).eq('id',id);if(error)throw err(error)},
  onSnapshot(cb,onErr){let dead=false;const load=()=>this.get().then(s=>{if(!dead)cb(s)}).catch(e=>{if(!dead&&onErr)onErr(e)});load();
    const un=listen(coll,ids=>{if(ids.has(id)||ids.has(null))load()});return ()=>{dead=true;un()}}}}
function query(coll,filters){return {
  where(f,op,v){return query(coll,[...(filters||[]),[f,op,v]])},
  async get(){return snapQ(await fetchRows(coll,filters))},
  onSnapshot(cb,onErr){let dead=false,busy=false,again=false;const load=async()=>{if(busy){again=true;return}busy=true;try{const r=await fetchRows(coll,filters);if(!dead)cb(snapQ(r))}catch(e){if(!dead&&onErr)onErr(e)}busy=false;if(again){again=false;load()}};load();
    const un=listen(coll,()=>load());return ()=>{dead=true;un()}}}}
const DB={collection(coll){const q=query(coll,[]);q.doc=id=>docRef(coll,id);return q},doc(path){const i=path.indexOf('/');return docRef(path.slice(0,i),path.slice(i+1))}};

// ---- користувач ----
const USER={async id(){return ME.uid},async me(){return {id:ME.uid}},async isOwner(){return ME.role==='owner'},async canEdit(){return ME.role==='owner'||ME.role==='admin'},
  async can(p){if(p==='data.write')return ME.role!=='viewer';return true},
  async profiles(ids){const out={};const list=(ids||[]).filter(x=>/^[0-9a-f-]{36}$/i.test(x));if(!list.length)return out;const {data}=await sb.from('members').select('uid,name').in('uid',list);(data||[]).forEach(r=>{out[r.uid]={name:r.name}});return out}};

// ---- завантаження файлів ----
const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',csv:'text/csv;charset=utf-8',json:'application/json',txt:'text/plain;charset=utf-8',pdf:'application/pdf'};
const DL={async save(o){const ext=String(o.filename||'').split('.').pop().toLowerCase();const d=o.data;const blob=d instanceof Blob?d:new Blob([d instanceof ArrayBuffer||ArrayBuffer.isView(d)?d:String(d)],{type:MIME[ext]||'application/octet-stream'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename||'file';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return {ok:true}}};

// ---- «хто на сайті» і повідомлення ----
function makeRoom(){const ch=sb.channel('room-budget',{config:{presence:{key:PEER},broadcast:{self:false}}});let peersCb=null;const H={};
  const peers=()=>{const st=ch.presenceState();const out=[];Object.values(st).forEach(arr=>(arr||[]).forEach(m=>out.push({peer:m.peer,by:m.by,kind:'user',presence:Object.assign({},m),isMe:m.by===ME.uid,sameTab:m.peer===PEER,updatedAt:m.at||0})));return out};
  ch.on('presence',{event:'sync'},()=>{if(peersCb)peersCb({peers:peers(),joined:[],left:[],updated:[]})});
  ch.on('broadcast',{event:'*'},m=>{const p=m.payload||{};const fn=H[m.event];if(fn)fn({data:p.data,by:p.by,peer:p.peer,isMe:p.by===ME.uid,sameTab:p.peer===PEER,kind:'user'})});
  let ready=new Promise(r=>ch.subscribe(s=>{if(s==='SUBSCRIBED')r()}));
  return {async presence(p){await ready;return ch.track(Object.assign({},p,{by:ME.uid,peer:PEER,at:Date.now()}))},onPeers(cb){peersCb=cb;return ()=>{peersCb=null}},on(ev,fn){H[ev]=fn;return ()=>{delete H[ev]}},
    async emit(ev,data){await ready;return ch.send({type:'broadcast',event:ev,payload:{data,by:ME.uid,peer:PEER}})}}}
let ROOMX=null;
window.claude={use:async n=>{if(!ME.uid)return null;if(n==='db')return DB;if(n==='user')return USER;if(n==='downloads')return DL;if(n==='room')return ROOMX||(ROOMX=makeRoom());return null}};

// ---- перенесення даних з резервної копії (лише власник; відкрити сайт з #import) ----
SBX.importBackup=async(json,onProgress)=>{if(ME.role!=='owner')throw new Error('Лише власник');const docs=(json&&json.docs)||[];let n=0;
  for(let i=0;i<docs.length;i+=40){const part=docs.slice(i,i+40).map(d=>({coll:d.coll,id:d.id,data:d.data,updated_at:new Date().toISOString()}));const {error}=await sb.from('docs').upsert(part,{onConflict:'coll,id'});if(error)throw err(error);n+=part.length;onProgress&&onProgress(n,docs.length)}return n};
})();
</script>

function sha256js(str){const K=[],H=[];let n=2,c=0;const fr=x=>(x-(x|0))*4294967296|0;while(c<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c++]=fr(Math.cbrt(n))}n++}

  const r=(x,k)=>(x>>>k)|(x<<(32-k));for(let o=0;o<by.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(by[o+i*4]<<24)|(by[o+i*4+1]<<16)|(by[o+i*4+2]<<8)|by[o+i*4+3];
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}

  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

function arCur(c,ctx){const cfg=S.cfg||{};const L=ctx.L,F=ctx.F,A=ctx.A;
  switch(c.t){case 'branch':return (cfg.branches||[]).find(b=>b.id===c.id);case 'producer':return (cfg.producers||[]).find(p=>p.id===c.id);
    case 'brand':{for(const p of cfg.producers||[]){const b=(p.brands||[]).find(x=>x.id===c.id);if(b)return b}return null}
    case 'position':return (cfg.positions||[]).find(x=>x.id===c.id);case 'logi_param':return L[c.key]!=null?{value:L[c.key]}:null;case 'logi_branch':return (L.branches||{})[c.branch]||null;case 'logi_brand':return (L.brands||{})[c.brand]||null;
    case 'logi_type':return Array.isArray(L.types)?L.types.find(x=>+x.cap===+c.cap)||null:null;case 'car':return (F.cars||[]).find(x=>x.no===c.no)||null;case 'forklift':return (F.forklifts||[]).find(x=>x.no===c.no)||null;case 'article':return (A.ut||[]).find(x=>x.ut===c.ut)||null}return null}
function arLabel(c){const bn=id=>(branches().find(b=>b.id===id)||{}).name||id;switch(c.t){case 'branch':return (c.data&&c.data.name)||bn(c.id);case 'producer':return (c.data&&c.data.name)||c.id;case 'brand':return ((c.data&&c.data.name)||c.id)+' · '+(((S.cfg||{}).producers||[]).find(p=>p.id===c.producer)||{}).name;case 'position':return (c.data&&c.data.name)||c.id;
  case 'logi_param':return AX_COLN[c.key]||c.key;case 'logi_branch':return bn(c.branch);case 'logi_brand':return (brands().find(b=>b.id===c.brand)||{}).name||c.brand;case 'logi_type':return c.cap+' кг';case 'car':case 'forklift':return c.no+(c.data&&c.data.branch?' · '+bn(c.data.branch):'');case 'article':return c.ut}return ''}
function arClean(res,ctx){const ok=new Set(Object.keys(AR_T));const BR=new Set(branches().map(b=>b.id)),PR=new Set(((S.cfg||{}).producers||[]).map(p=>p.id)),BB=new Set(brands().map(b=>b.id));const out=[];
  (Array.isArray(res&&res.changes)?res.changes:[]).slice(0,500).forEach(c=>{if(!c||!ok.has(c.t))return;const d=c.data&&typeof c.data==='object'?JSON.parse(JSON.stringify(c.data)):{};const x={t:c.t,op:c.op==='update'?'update':'add',data:d,why:String(c.why||'').slice(0,60)};
    if(['branch','producer','brand','position'].includes(c.t)){x.id=String(c.id||'').toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'').slice(0,40);if(!x.id)x.id=slug(d.name||'x')}
    if(c.t==='brand'){if(!PR.has(c.producer))return;x.producer=c.producer}
    if(c.t==='position'){if(d.dept&&!['sklad','log','admin'].includes(d.dept))delete d.dept;if(d.pay&&!['shift','salary'].includes(d.pay))delete d.pay;if(d.line&&!(d.dept&&SEC[d.dept].lines.some(l=>l[0]===d.line)))delete d.line}
    if(c.t==='logi_param'){x.key=String(c.key||'');if(!x.key||typeof d.value!=='number')return}
    if(c.t==='logi_branch'){if(!BR.has(c.branch))return;x.branch=c.branch;Object.keys(d).forEach(k=>{if(typeof d[k]!=='number'&&!(d[k]&&typeof d[k]==='object'))delete d[k]})}
    if(c.t==='logi_brand'){if(!BB.has(c.brand))return;x.brand=c.brand}
    if(c.t==='logi_type'){x.cap=+c.cap;if(!x.cap)return}
    if(c.t==='car'||c.t==='forklift'){x.no=String(c.no||'').trim();if(!x.no)return;if(d.branch&&!BR.has(d.branch))delete d.branch}
    if(c.t==='article'){x.ut=String(c.ut||'').trim();if(!x.ut)return;if(d.sec&&!SECL[d.sec])delete d.sec}
    const cur=arCur(x,ctx);x.op=cur?'update':'add';if(Array.isArray(d.aliases)&&cur){d.aliases=d.aliases.filter(a=>!(cur.aliases||[]).includes(a));if(!d.aliases.length)delete d.aliases}
    if(cur)Object.keys(d).forEach(k=>{if(k!=='aliases'&&JSON.stringify(cur[k])===JSON.stringify(d[k]))delete d[k]});if(x.op==='update'&&!Object.keys(d).length)return;x.on=true;out.push(x)});return out}

// повертає {branchId, month, scen, sections:{id:{values, comment, rows, count}}, warnings:[]}
function xlParse(wb,knownProducers){
  const out={branchId:null,month:null,scen:null,sections:{},warnings:[]};
  wb.SheetNames.forEach(name=>{const ws=wb.Sheets[name];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
    const sid=aoa[1]&&aoa[1][0]!=null?String(aoa[1][0]).trim():null;const sec=SEC[sid];if(!sec)return;
    if(!out.branchId&&aoa[1][1]){const m=String(aoa[1][1]).split('|');if(m.length===3){out.branchId=m[0];out.month=/^\d{4}-\d{2}$/.test(m[1])?m[1]:null;out.scen=m[2]==='fact'?'fact':'plan'}}
    const res={values:{},comment:null,rows:null,count:0};
    if(sid==='staff'){res.rows=[];for(let r=5;r<aoa.length;r++){const row=aoa[r]||[];const cells=row.slice(1,10);if(!cells.some(x=>x!=null&&String(x).trim()!==''))continue;
        const dept=DEPT_BY_NAME[String(cells[0]||'').trim().toLowerCase()];if(!dept){out.warnings.push(`${name}, рядок ${r+1}: підрозділ має бути Склад, Логістика або Адмін (зараз «${cells[0]??''}»).`);continue}
        let line=cells[3]!=null?String(cells[3]).trim():'';if(!STAFF_DEPTS[dept].lines.includes(line))line=STAFF_DEPTS[dept].lines[0];
        const num=(x,col)=>{if(x==null||String(x).trim()==='')return null;const n=typeof x==='number'?x:parse(x);if(Number.isNaN(n)){out.warnings.push(`${name}, рядок ${r+1}, ${col}: «${x}» не число.`);return null}return n};
        res.rows.push({dept,name:cells[1]!=null?String(cells[1]):'',pos:cells[2]!=null?String(cells[2]):'',line,units:num(cells[4],'Од.')??1,pay:PAY_BY_NAME[String(cells[5]||'').trim().toLowerCase()]||'salary',przo:num(cells[6],'Ставка'),f1:num(cells[7],'Оклад ф1'),extra:num(cells[8],'Доплати')});res.count++}
      out.sections[sid]=res;return}
    if(sec.pp){const codes=aoa[1];const lk=new Set(sec.lines.map(l=>l[0]));
      for(let r=5;r<aoa.length;r++){const row=aoa[r]||[];const id=row[0]!=null?String(row[0]).trim():'';if(!id)continue;
        if(id==='comment'){const t=row[2];if(t!=null&&String(t).trim()!=='')res.comment=String(t);continue}
        const known=!knownProducers||knownProducers.includes(id);let warned=false;
        for(let c=2;c<row.length;c++){const k=codes[c]!=null?String(codes[c]).trim():'';if(!lk.has(k))continue;const x=row[c];if(x==null||String(x).trim()==='')continue;
          if(!known){if(!warned){out.warnings.push(`${name}, рядок ${r+1}: бренду «${String(row[1]||id).trim()}» немає в довіднику — рядок пропущено.`);warned=true}continue}
          const n=typeof x==='number'?x:parse(x);if(Number.isNaN(n)){out.warnings.push(`${name}, рядок ${r+1}: «${x}» не число — пропущено.`);continue}
          res.values[k+':'+id]=n;res.count++}}
      out.sections[sid]=res;return}
    const codes=aoa[1].slice();const keys=new Set(sec.lines.map(l=>l[0]));
    for(let r=3;r<aoa.length;r++){const row=aoa[r]||[];const k=row[0]!=null?String(row[0]).trim():'';
      if(k==='comment'){const t=row[3];if(t!=null&&String(t).trim()!=='')res.comment=String(t);continue}
      if(!keys.has(k))continue;
      for(let c=3;c<row.length;c++){const code=codes[c]!=null?String(codes[c]).trim():'';if(!code)continue;const x=row[c];if(x==null||String(x).trim()==='')continue;
        if(sec.pp&&knownProducers&&!knownProducers.includes(code)){out.warnings.push(`${name}: виробника з кодом «${code}» немає у філії — стовпець пропущено.`);codes[c]=null;continue}
        const n=typeof x==='number'?x:parse(x);if(Number.isNaN(n)){out.warnings.push(`${name}, рядок ${r+1}: «${x}» не число — пропущено.`);continue}
        res.values[sec.pp?k+':'+code:k]=n;res.count++}}
    out.sections[sid]=res});

function xlSalesParse(wb){const out={branchId:null,branchRaw:null,month:null,monthRaw:null,values:{},comment:null,count:0,brands:new Set(),warnings:[],error:null};

async function bulkApply(r,m,replace){if(!S.db){toast('Немає зв’язку зі сховищем');return null}const isFact=r.kind==='fact2',isPlan=r.kind==='plan2'||isFact,SC=isFact?'fact':'plan';let n=0;const skip=[];
  for(const [b,items] of Object.entries(r.items)){const bn=(branches().find(x=>x.id===b)||{}).name||b;let cur=await getSalesDoc(b,m,SC);const s=cur&&cur.status;if(isFact?(s==='approved'||s==='submitted')&&!S.admin:(s==='approved'||(s==='submitted'&&!S.admin))){skip.push(bn);continue}

    if(isPlan){if(replace)Object.keys(v).forEach(k=>{const x=k.split(':')[1];if(x&&!items[x]&&/^(s_uah|s_kg|m_uah)$/.test(k.split(':')[0]))delete v[k]});
      Object.entries(items).forEach(([x,it])=>{if(it.s_uah!=null)v['s_uah:'+x]=Math.round(it.s_uah*100)/100;if(it.s_kg!=null)v['s_kg:'+x]=Math.round(it.s_kg*100)/100;
